name: Build

on:
  push:
  workflow_dispatch:

# Least privilege: every job only reads the repository. Jobs that need more must ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Dockerfile (node:24) and airgap-vault.
  NODE_VERSION: '24'

jobs:
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ignore-scripts: no dependency lifecycle script runs. The repo's own postinstall
      # (coinlib patch and browserify, jetifier, diagnostic modules, patches) is then run explicitly.
      - name: 🔧 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts && npm run postinstall

      - name: 💅 Prettier
        run: npm run actions:prettier

      - name: 🧪 Test
        run: npm run test-ci

      - name: 🧹 Lint
        run: npm run lint-ci

      - name: 📦 Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: lintReport.json
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: 🏗️ Build Web
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ignore-scripts: no dependency lifecycle script runs. The repo's own postinstall
      # (coinlib patch and browserify, jetifier, diagnostic modules, patches) is then run explicitly.
      - name: 🔧 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts && npm run postinstall

      - name: 🏗️ Build
        run: npm run prepare-prod-build && npm run build:prod

      - name: 📦 Upload www
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www
          path: www
          if-no-files-found: error
          retention-days: 7

      # GitHub Pages serves the app from /airgap-wallet/ (same base href as the angular.json deploy target).
      # 404.html lets deep links fall back to the app's router.
      - name: 🗂️ Prepare GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          cp -R www pages
          sed -i 's|<base href="[^"]*"|<base href="/airgap-wallet/"|' pages/index.html
          grep -q '<base href="/airgap-wallet/"' pages/index.html
          cp pages/index.html pages/404.html

      - name: 📦 Upload GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  pages:
    name: 🚀 Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [test, web]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Never cancel a deployment halfway; a newer one waits for it instead.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: 🚀 Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
