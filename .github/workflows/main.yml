name: Build

on:
  push:
  workflow_dispatch:

# Least privilege: every job only reads the repository. Jobs that need more must ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Dockerfile (node:20).
  NODE_VERSION: '20'

jobs:
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 💅 Prettier
        run: npm run actions:prettier

      - name: 🧪 Test
        run: npm run test-ci

      - name: 🧹 Lint
        run: npm run lint-ci

      - name: 📦 Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: lintReport.json
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: 🏗️ Build Web
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 🏗️ Build
        run: npm run prepare-prod-build && npm run build:prod

      - name: 📦 Upload www
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www
          path: www
          if-no-files-found: error
          retention-days: 7
