<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AirGap Wallet</title>

    <base href="/" />

    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="./assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="msapplication-tap-highlight" content="no" />
    <script>
      function getChromeVersion() {
        var raw = navigator.userAgent.match(/Chrom(e|ium)\/([0-9]+)\./)
        return raw ? parseInt(raw[2], 10) : false
      }
      if (getChromeVersion() === 77) {
        window.TransformStream = null
        window.WritableStream = null
        window.ReadableStream = null
      }
    </script>
    <script src="cordova.js"></script>
    <style>
      /* Painted before the app's stylesheets arrive. Keep in sync with src/theme/variables.scss. */
      body {
        background: #ffffff;
      }
      body.dark {
        background: #1e1e1e;
      }
    </style>
  </head>

  <body>
    <script>
      // Applies the theme before Angular boots, so the first paint behind the splash
      // screen is already dark when it should be. Reads the theme ThemeService mirrored
      // to localStorage (see ThemeService.LOCAL_STORAGE_MIRROR_KEY).
      ;(function () {
        try {
          var theme = localStorage.getItem('airgap-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (theme === 'dark' || (theme !== 'light' && prefersDark)) {
            document.body.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
    <app-root></app-root>
  </body>
</html>
